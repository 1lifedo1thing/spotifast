# Build the complete app input in the native macOS release job first.
schema: 1
tool:
  version: 0.5.1
  nfpm: 2.47.0
nfpm:
  name: fastpotify
  maintainer: Carmine Paolino <carmine@paolino.me>
  description: Fastpotify macOS application
  license: MIT
release:
  repository: crmne/fastpotify
  prereleases: true
targets:
  macos-universal:
    platform: macos
    arch: universal
    formats: [dmg]
    input:
      kind: directory
      local: dist/macos-input
    native:
      command: [ruby, packaging/macos/dmg.rb, '@PAYLOAD@', '@PACKAGE@']
      output: 'fastpotify-@TAG@-macos-universal.dmg'
